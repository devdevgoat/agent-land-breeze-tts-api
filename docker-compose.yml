# Breeze TTS 2 streaming API (RTX 4090 / sm89).
# flash-attn 2.8.3 only knows archs 80/90/100/110/120; sm80 kernels run on Ada (sm89).
#   docker compose up -d --build                  # build + start (fast path: ~100 ms TTFA, RTF ~0.66, ~90 s warmup)
#   BREEZE_ARGS=--no-fast-all docker compose up -d   # eager mode: ~9 GiB VRAM, fast start, but RTF ~3.2 (slower than real time)
services:
  breeze-tts:
    image: breeze-pytorch-infer:latest
    build:
      context: ./src
      dockerfile: docker/Dockerfile
      args:
        FLASH_ATTN_CUDA_ARCHS: "${FLASH_ATTN_CUDA_ARCHS:-80}"   # 80 covers Ampere/Ada; 90 for Hopper
    container_name: breeze-tts
    restart: unless-stopped
    entrypoint: []  # upstream entrypoint.sh is just `exec "$@"`; skip it (CRLF-safe on Windows checkouts)
    ipc: host
    ports:
      - "7860:7860"
    volumes:
      - ./models/breeze-tts-2:/models/breeze:ro
      - ./server:/app:ro          # voice_api.py: upstream API + server-side voice presets
      - ./voices:/voices          # voices: <name>.wav + .txt (+ .json); designed voices are saved here
    command: >
      sh -c "python -m voice_api /models/breeze --host 0.0.0.0 --port 7860 $${BREEZE_ARGS:-}"
    environment:
      BREEZE_ARGS: ${BREEZE_ARGS:---fast-all}
      BREEZE_VOICES_DIR: /voices
      PYTHONPATH: /app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7860/health"]
      interval: 15s
      timeout: 5s
      start_period: 300s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
