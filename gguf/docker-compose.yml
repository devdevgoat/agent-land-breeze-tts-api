# Breeze TTS 2 GGUF (Breeze-TTS-2.cpp, Q8_0, ggml CUDA) behind the same API as the
# PyTorch service. Separate compose project: it never starts with ../docker-compose.yml,
# and both use host port 7860, so run only one at a time.
#
#   docker compose -f gguf/docker-compose.yml up -d --build   # build + start (~10 s to load)
#   docker compose -f gguf/docker-compose.yml stop            # stop (keeps the container)
#   docker compose -f gguf/docker-compose.yml logs -f
name: breeze-tts-gguf
services:
  breeze-tts-gguf:
    image: breeze-tts-gguf:latest
    build:
      context: .
      args:
        CUDA_ARCHS: "${CUDA_ARCHS:-89}"   # your GPU: nvidia-smi --query-gpu=compute_cap (8.9 -> 89)
    container_name: breeze-tts-gguf
    restart: unless-stopped
    ports:
      - "7860:7860"
    volumes:
      - ../models/gguf:/models:ro
      - ../voices:/voices          # same voices as the PyTorch service; designed voices are saved here
      - ../responses:/responses    # warm responses (/v1/audio/speech/warm); kept 24 h, survive restarts
      - ../API.md:/opt/breeze/API.md:ro   # served at GET /usage; edits show up without a rebuild
    environment:
      BREEZE_MODEL: /models/breeze-tts-2-q8_0.gguf
      BREEZE_VOICES_DIR: /voices
      BREEZE_RESPONSES_DIR: /responses
      BREEZE_RESPONSE_TTL_SECONDS: ${BREEZE_RESPONSE_TTL_SECONDS:-86400}
      # extra breeze-server flags, e.g. "--chunk-first 2 --chunk-max 40 --verbose"
      # chunk-max 12 (~1 s pieces): ~8% slower overall than 40, but /response/{id}
      # can start playing after ~1.5 s instead of ~4 s (see CHUNK_MAX_SECONDS).
      BREEZE_ENGINE_ARGS: ${BREEZE_ENGINE_ARGS:---chunk-max 12}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7860/health"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
